
services:
  
  scry_caddy:
    container_name: scry-caddy
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./site:/srv
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - caddy_net
   
  scry_backend:
    container_name: scry-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/usr/src/app # Sync the backend code
      - ./persistent01:/persistent01  # Mount for file access
    environment:
      - PYTHONPATH=/usr/src/app
      - CELERY_BROKER_URL=redis://scry_redis:6379/0
    networks:
      - caddy_net
  
  scry_redis:
    container_name: scry-redis
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - caddy_net
  
  scry_celery:
    container_name: scry-celery
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A worker:celery_app worker --loglevel=info --concurrency=4
    depends_on:
      - scry_backend
      - scry_redis
    volumes:
      - ./backend/app:/usr/src/app
      - ./persistent01:/persistent01  # Mount for file access
    environment:
      - CELERY_BROKER_URL=redis://scry_redis:6379/0
    networks:
      - caddy_net
  
  scry_frontend:
    container_name: scry-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_ENDPOINT: ${BACKEND_ENDPOINT}
    ports:
      - "3000:3000"
    # volumes:
      # - ./frontend:/app # Sync the frontend code
    networks:
      - caddy_net
    depends_on:
      - scry_backend

volumes:
  caddy_data:
  caddy_config:
  
networks:
  caddy_net: