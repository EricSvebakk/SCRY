
services:
        
  thesis_docker_backend:
    container_name: thesis-docker-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        FRONTEND_ENDPOINT: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      # - ./thesis_backend:/code  # Sync the backend code
      - ./persistent01:/persistent01  # Mount thesis_data for file storage
    environment:
      # - FRONTEND_ENDPOINT=http://localhost:3000
      - PYTHONPATH=/usr/src/app
  
  thesis_docker_frontend:
    container_name: thesis-docker-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_ENDPOINT: http://localhost:8000 
    ports:
      - "3000:3000"
    # environment:
    #   - NEXT_PUBLIC_BACKEND_ENDPOINT=https://localhost:8000
    depends_on:
      - thesis_docker_backend